
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h1 class="Application">Weather App🌩️</h1>
        <input type="text" class="city-input" placeholder="Enter city name">
        <button onclick="getWeather()" class="search">🔍</button>
        <div class="weather-info"></div>
        <h1 class="temperature">--°F❄️</h1>
        <h1 class="celcius">--°C🔥</h1>
        <h1 class="Humidity">Humidity: --%</h1>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
